<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 53</title>
</head>
<body>
    <script type="text/javascript">
        var a_pis = parseInt(prompt("Podaj wymiar a (wysokość):", ""));
        var b_pis = parseInt(prompt("Podaj wymiar b (szerokość):", ""));

        for(var i_pis = 1; i_pis <= b_pis; i_pis++) {
            document.write("*");
        }
        document.write("<br>");

        var wiersz_pis = "*";
        for (var i_pis = 1; i_pis <= (b_pis - 2); i_pis++) {
            wiersz_pis = wiersz_pis + "&nbsp;&nbsp;";
        }
        wiersz_pis = wiersz_pis + "*";

        for(var i_pis = 1; i_pis <= a_pis - 2; i_pis++) {
            document.write(wiersz_pis + "<br>");
        }

        for(var i_pis = 1; i_pis <= b_pis; i_pis++) {
            document.write("*");
        }
        document.write("<br>");
    </script>
</body>
</html>
