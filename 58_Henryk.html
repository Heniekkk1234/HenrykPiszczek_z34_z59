<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 58</title>
</head>
<body>
    <script type="text/javascript">
        var liczba1_pis = parseInt(prompt("Podaj pierwszą liczbę:", ""));
        var liczba2_pis = parseInt(prompt("Podaj drugą liczbę:", ""));
        var domyslna_wielkosc_pis = 24; 

        if(liczba1_pis === liczba2_pis) {
            confirm("Podane liczby są równe. Brak obliczeń.");
        } else if(liczba1_pis < liczba2_pis) {
            for(var i_pis = liczba1_pis; i_pis <= liczba2_pis; i_pis++) {
                if(i_pis % 2 !== 0) {
                    document.write("<span style='color: green; font-size:" + domyslna_wielkosc_pis + "px;'>" + i_pis + "</span><br>");
                }
            }
        } else if(liczba1_pis > liczba2_pis) {
            for(var i_pis = liczba1_pis; i_pis >= liczba2_pis; i_pis--) {
                if(i_pis % 2 !== 0) {
                    document.write("<span style='color: blue; font-size:" + (domyslna_wielkosc_pis / 2) + "px;'>" + i_pis + "</span><br>");
                }
            }
        }
    </script>
</body>
</html>
