<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 50</title>
</head>
<body>
    <div style="font-size: 2cm; color: red;">Piszczek</div>
    <div style="font-size: 5mm; color: blue;">Wyprowadzanie liczb od 1 do 10 przesuniętych o jedną spację w prawo. Demonstarcja pętli zagnieżdżonych.</div>
    <br>
    <script type="text/javascript">
        for (var i_pis = 1; i_pis <= 10; i_pis++) {
            for (var k_pis = 1; k_pis <= i_pis; k_pis++) {
                document.write("&nbsp;&nbsp;"); 
            }
            document.write(i_pis + "<br>");
        }
    </script>
</body>
</html>
