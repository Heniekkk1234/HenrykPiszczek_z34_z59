    <script type="text/javascript">
        var suma_pis = 0;
        for(var i_pis = 1; i_pis <= 1000000; i_pis++) {
            suma_pis = suma_pis + (1 / i_pis);
        }
        document.write("Suma szeregu harmonicznego od 1 do 1000000 wynosi: " + suma_pis);
    </script>
