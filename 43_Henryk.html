<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 43</title>
</head>
<body>
    <script type="text/javascript">
        var koniec_petli_pis = prompt("Podaj koniec pętli:", "");
        var koniec = parseInt(koniec_petli_pis);
        for(var i_pis = 2; i_pis <= koniec; i_pis += 2) {
            document.write(i_pis + "<br>");
        }
    </script>
</body>
</html>
