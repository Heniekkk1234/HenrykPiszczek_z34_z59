<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 46</title>
</head>
<body>
    <div style="color:red; font-size:50px;">
    <script type="text/javascript">
        var h_pis, a_pis;
        do {
            h_pis = parseFloat(prompt("Podaj wysokość (h > 0):", ""));
        } while (h_pis <= 0 || isNaN(h_pis));

        do {
            a_pis = parseFloat(prompt("Podaj podstawę (a > 0):", ""));
        } while (!(a_pis > 0) || isNaN(a_pis));

        var Pole = a_pis * h_pis / 2;
        document.write("Pole=" + Pole.toFixed(2) + " cm^2<br>");
    </script>
    </div>
</body>
</html>
