 <textarea cols="150" rows="50">
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <title>Zadanie 55</title>
</head>
<body>
    <script type="text/javascript">
        var l1_t_pis, l2_t_pis;

        do {
            l1_t_pis = parseInt(prompt("Podaj liczbę l1_t z przedziału <20, 60>:", ""));
            if(l1_t_pis < 20 || l1_t_pis > 60 || isNaN(l1_t_pis)) {
                document.write("Liczba l1_t=" + l1_t_pis + " nie należy do przedziału <20,60><br>");
            }
        } while(l1_t_pis < 20 || l1_t_pis > 60 || isNaN(l1_t_pis));

        do {
            l2_t_pis = parseInt(prompt("Podaj liczbę l2_t z przedziału <20, 60>:", ""));
            if(l2_t_pis < 20 || l2_t_pis > 60 || isNaN(l2_t_pis)) {
                document.write("Liczba l2_t=" + l2_t_pis + " nie należy do przedziału <20,60><br>");
            }
        } while(l2_t_pis < 20 || l2_t_pis > 60 || isNaN(l2_t_pis));

        var pocz_pis = parseInt(prompt("Podaj wartość początkową wielkości tekstu:", ""));
        var tekst_pis = prompt("Podaj tekst do wyświetlenia:", "");

        if (l1_t_pis < l2_t_pis) {
            for(var i_pis = pocz_pis; i_pis <= 100; i_pis += 5) {
                document.write("<p style=\"font-size:" + i_pis + "px; color: black;\">" + tekst_pis + "</p>");
            }
        } else if (l2_t_pis < l1_t_pis) {
            for(var i_pis = pocz_pis; i_pis >= 0; i_pis -= 5) {
                document.write("<p style=\"font-size:" + i_pis + "px; color: black;\">" + tekst_pis + "</p>");
            }
        } else {
            document.write("<p style=\"font-size:" + pocz_pis + "px; color: black;\">" + tekst_pis + "</p>");
        }
    </script>
</body>
</html>
